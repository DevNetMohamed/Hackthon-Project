name: Docker CI/CD to Docker Hub

on:
  push:

permissions:
  contents: read

env:
  IMAGE_NAME: aws-docker-lab
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN_v2: ${{ secrets.DOCKERHUB_TOKEN_v2 }}

jobs:
  build-and-push:
    name: Build Docker Image and Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker image
        run: docker image inspect "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN_v2 != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN_v2 }}

      - name: Tag and push image to Docker Hub
        if: github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN_v2 != ''
        shell: bash
        run: |
          REMOTE_IMAGE="${DOCKERHUB_USERNAME}/${IMAGE_NAME}"

          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${REMOTE_IMAGE}:${GITHUB_SHA}"
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${REMOTE_IMAGE}:latest"

          docker push "${REMOTE_IMAGE}:${GITHUB_SHA}"
          docker push "${REMOTE_IMAGE}:latest"

          echo "Published: ${REMOTE_IMAGE}:${GITHUB_SHA}"
          echo "Published: ${REMOTE_IMAGE}:latest"

      - name: Docker Hub push skipped
        if: github.ref == 'refs/heads/main' && (env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN_v2 == '')
        run: echo "Docker image was built successfully. Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN_v2 secrets to enable publishing."
