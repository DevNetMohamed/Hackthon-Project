name: Docker CI/CD to Docker Hub

on:
  push:

permissions:
  contents: read

env:
  IMAGE_NAME: aws-docker-lab
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_TOKEN_V2: ${{ secrets.DOCKER_TOKEN_V2 }}

jobs:
  build-and-push:
    name: Build Docker Image and Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./aws-docker-lab-part3
          file: ./aws-docker-lab-part3/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker image
        run: docker image inspect "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/master' && env.DOCKER_USERNAME != '' && env.DOCKER_TOKEN_V2 != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_TOKEN_V2 }}

      - name: Tag and push image to Docker Hub
        if: github.ref == 'refs/heads/master' && env.DOCKER_USERNAME != '' && env.DOCKER_TOKEN_V2 != ''
        shell: bash
        run: |
          REMOTE_IMAGE="${DOCKER_USERNAME}/${IMAGE_NAME}"

          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${REMOTE_IMAGE}:${GITHUB_SHA}"
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${REMOTE_IMAGE}:latest"

          docker push "${REMOTE_IMAGE}:${GITHUB_SHA}"
          docker push "${REMOTE_IMAGE}:latest"

          echo "Published: ${REMOTE_IMAGE}:${GITHUB_SHA}"
          echo "Published: ${REMOTE_IMAGE}:latest"

      - name: Docker Hub push skipped
        if: github.ref == 'refs/heads/master' && (env.DOCKER_USERNAME == '' || env.DOCKER_TOKEN_V2 == '')
        run: echo "Docker image was built successfully. Add DOCKER_USERNAME and DOCKER_TOKEN_V2 secrets to enable publishing."
